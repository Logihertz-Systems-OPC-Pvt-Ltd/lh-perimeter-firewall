[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-perimeter-firewall"
version = "0.1.0"
description = "Audits AWS WAF/Cloudflare/ModSecurity rule manifests, OWASP Core Rule Set (CRS) paranoia configurations, and iptables/nftables perimeter policies for shadow allow rules, detection-only bypasses, and missing egress filters."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "waf-security",
    "owasp-crs",
    "firewall-audit",
    "iptables",
    "nftables",
    "perimeter-security",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perimeter-firewall"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perimeter-firewall"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perimeter-firewall#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-perimeter-firewall/issues"

[project.scripts]
lh-firewall = "lh_perimeter_firewall.cli:app"
lh-waf = "lh_perimeter_firewall.cli:app"
lh-perimeter-firewall = "lh_perimeter_firewall.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_perimeter_firewall"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

